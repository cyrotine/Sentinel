[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "qdrant-client>=1.12",
  "langchain>=0.3",
  "langgraph>=0.2",
  "PyGithub>=2.4",
  "gitpython>=3.1",
  "tree-sitter>=0.23",
  "langchain-google-genai>=2.0",
  "tiktoken>=0.9",
  "httpx>=0.27",
  "forge-agents",
  "forge-workflows",
  "forge-github",
  "forge-repository-analysis",
  "forge-vector-store",
]

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
forge-agents = { workspace = true }
forge-workflows = { workspace = true }
forge-github = { workspace = true }
forge-repository-analysis = { workspace = true }
forge-vector-store = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
