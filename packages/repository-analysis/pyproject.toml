[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-repository-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "tree-sitter>=0.23",
  "gitpython>=3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["forge_repository_analysis"]
